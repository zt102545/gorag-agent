server {
    listen 80;
    server_name testapi.realcopyright.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/testapi.realcopyright.cn;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name testapi.realcopyright.cn;

    ssl_certificate /www/server/panel/vhost/cert/testapi.realcopyright.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/testapi.realcopyright.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/chat responses must be delivered immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/testapi.realcopyright.cn.log;
    error_log /www/wwwlogs/testapi.realcopyright.cn.error.log;
}
